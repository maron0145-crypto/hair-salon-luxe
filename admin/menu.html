<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メニュー・料金 | Luxe 管理画面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin-style.css">
</head>
<body>

  <div class="admin-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="admin-main">
      <header class="admin-header">
        <h1 class="page-title">メニュー・料金</h1>
      </header>
      <div class="admin-content">
        <div class="form-layout">

          <!-- 編集エリア -->
          <div class="card">
            <p class="card-title">メニュー編集</p>
            <div class="menu-edit-tabs" id="menuTabs">
              <button class="tab-btn active" data-tab="cut">カット</button>
              <button class="tab-btn" data-tab="color">カラー</button>
              <button class="tab-btn" data-tab="perm">パーマ</button>
              <button class="tab-btn" data-tab="treatment">トリートメント</button>
              <button class="tab-btn" data-tab="headspa">ヘッドスパ</button>
            </div>
            <div id="tabContent"></div>
            <div class="form-actions">
              <button class="btn-save" id="saveBtn">保存する</button>
              <span class="save-note">※ 現在はプレビューのみ。DB実装後に保存できます。</span>
            </div>
          </div>

          <!-- ライブプレビュー -->
          <div class="preview-panel">
            <div class="preview-header">TOPページ メニュープレビュー</div>
            <div class="preview-body" id="menuPreview"></div>
          </div>

        </div>
      </div>
    </main>
  </div>

  <script src="js/site-data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin-common.js"></script>
  <script>
    initAdmin();

    const TAB_LABELS = {
      cut:       { en: 'Cut',       ja: 'カット' },
      color:     { en: 'Color',     ja: 'カラー' },
      perm:      { en: 'Perm',      ja: 'パーマ' },
      treatment: { en: 'Treatment', ja: 'トリートメント' },
      headspa:   { en: 'Head Spa',  ja: 'ヘッドスパ' },
    };

    let currentTab = 'cut';

    function renderTabContent(tab) {
      const items = SITE_DATA.menu[tab];
      document.getElementById('tabContent').innerHTML = `
        <table class="menu-edit-table">
          <thead>
            <tr>
              <th>メニュー名</th>
              <th>料金</th>
            </tr>
          </thead>
          <tbody>
            ${items.map((item, i) => `
              <tr>
                <td>
                  <input class="menu-edit-input" type="text"
                    data-tab="${tab}" data-index="${i}" data-field="name"
                    value="${item.name}">
                </td>
                <td>
                  <input class="menu-edit-input" type="text"
                    data-tab="${tab}" data-index="${i}" data-field="price"
                    value="${item.price}">
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function renderPreview(tab) {
      const items = SITE_DATA.menu[tab];
      const label = TAB_LABELS[tab];
      document.getElementById('menuPreview').innerHTML = `
        <div class="preview-menu-card">
          <div class="preview-menu-header">
            <div class="preview-menu-en">${label.en}</div>
            <div class="preview-menu-ja">${label.ja}</div>
          </div>
          <div class="preview-menu-list">
            ${items.map(item => `
              <div class="preview-menu-item">
                <span>${item.name}</span>
                <span>¥${item.price}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // タブ切り替え
    document.getElementById('menuTabs').addEventListener('click', function(e) {
      const btn = e.target.closest('.tab-btn');
      if (!btn) return;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTab = btn.dataset.tab;
      renderTabContent(currentTab);
      renderPreview(currentTab);
    });

    // 入力変更でプレビュー更新
    document.getElementById('tabContent').addEventListener('input', function(e) {
      const input = e.target;
      if (!input.dataset.tab) return;
      SITE_DATA.menu[input.dataset.tab][input.dataset.index][input.dataset.field] = input.value;
      renderPreview(currentTab);
    });

    // 保存ボタン（見せかけ）
    document.getElementById('saveBtn').addEventListener('click', function() {
      showToast('保存しました（※ DB実装後に反映されます）');
    });

    // 初期表示
    renderTabContent(currentTab);
    renderPreview(currentTab);
  </script>

</body>
</html>
