<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | Luxe 管理画面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin-style.css">
</head>
<body>

  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <span class="login-logo-en">Luxe</span>
        <span class="login-logo-label">管理画面</span>
      </div>

      <form class="login-form" id="loginForm" novalidate>
        <div class="form-group">
          <label for="loginId">ログインID</label>
          <input type="text" id="loginId" class="form-control" placeholder="admin" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="loginPassword">パスワード</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="submit" class="btn-login">ログイン</button>
      </form>

      <p class="login-note">※ テスト環境のため、任意の値でログインできます</p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const id = document.getElementById('loginId').value;
      const password = document.getElementById('loginPassword').value;
      if (login(id, password)) {
        setLoggedIn();
        window.location.href = 'dashboard.html';
      }
    });
  </script>

</body>
</html>
