<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予約・問い合わせ | Luxe 管理画面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin-style.css">
</head>
<body>

  <div class="admin-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="admin-main">
      <header class="admin-header">
        <h1 class="page-title">予約・問い合わせ</h1>
      </header>
      <div class="admin-content">
        <div class="card">
          <p class="card-title">問い合わせ一覧</p>
          <div class="table-wrapper">
            <table class="data-table" id="reservationTable"></table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/site-data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin-common.js"></script>
  <script>
    initAdmin();

    const statusLabels = { pending: '未対応', confirmed: '確認済', canceled: 'キャンセル' };

    function renderTable() {
      document.getElementById('reservationTable').innerHTML = `
        <thead>
          <tr>
            <th>お名前</th>
            <th>ご希望メニュー</th>
            <th>希望日時</th>
            <th>ご要望</th>
            <th>ステータス</th>
          </tr>
        </thead>
        <tbody>
          ${SITE_DATA.reservations.map(r => `
            <tr>
              <td>${r.name}</td>
              <td>${r.menu}</td>
              <td>${r.date}</td>
              <td>${r.message || '—'}</td>
              <td>
                <select class="status-select" data-id="${r.id}" onchange="changeStatus(this)">
                  <option value="pending"   ${r.status === 'pending'   ? 'selected' : ''}>未対応</option>
                  <option value="confirmed" ${r.status === 'confirmed' ? 'selected' : ''}>確認済</option>
                  <option value="canceled"  ${r.status === 'canceled'  ? 'selected' : ''}>キャンセル</option>
                </select>
              </td>
            </tr>
          `).join('')}
        </tbody>
      `;
    }

    function changeStatus(select) {
      const id = Number(select.dataset.id);
      const target = SITE_DATA.reservations.find(r => r.id === id);
      if (target) {
        target.status = select.value;
        showToast(`ステータスを「${statusLabels[select.value]}」に変更しました`);
      }
    }

    renderTable();
  </script>

</body>
</html>
