<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダッシュボード | Luxe 管理画面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin-style.css">
</head>
<body>

  <div class="admin-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="admin-main">
      <header class="admin-header">
        <h1 class="page-title">ダッシュボード</h1>
      </header>
      <div class="admin-content">

        <div class="stat-cards">
          <div class="stat-card">
            <p class="stat-label">今月の予約数</p>
            <p class="stat-value">12<span class="stat-unit">件</span></p>
          </div>
          <div class="stat-card">
            <p class="stat-label">今週の問い合わせ</p>
            <p class="stat-value">5<span class="stat-unit">件</span></p>
          </div>
          <div class="stat-card">
            <p class="stat-label">未対応</p>
            <p class="stat-value">3<span class="stat-unit">件</span></p>
          </div>
        </div>

        <div class="dashboard-grid">
          <div class="card">
            <p class="card-title">最新の問い合わせ</p>
            <div class="table-wrapper">
              <table class="data-table" id="recentTable"></table>
            </div>
          </div>

          <div class="card">
            <p class="card-title">管理メニュー</p>
            <div class="quick-links">
              <a href="reservations.html" class="quick-link-btn">予約管理</a>
              <a href="menu.html" class="quick-link-btn">メニュー管理</a>
              <a href="stylist.html" class="quick-link-btn">スタイリスト</a>
              <a href="store-info.html" class="quick-link-btn">店舗情報</a>
              <a href="news.html" class="quick-link-btn">お知らせ</a>
              <a href="../index.html" class="quick-link-btn" target="_blank">TOPページ</a>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="js/site-data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin-common.js"></script>
  <script>
    initAdmin();

    const statusLabels = { pending: '未対応', confirmed: '確認済', canceled: 'キャンセル' };
    const statusClass  = { pending: 'badge-pending', confirmed: 'badge-confirmed', canceled: 'badge-canceled' };

    document.getElementById('recentTable').innerHTML = `
      <thead>
        <tr>
          <th>お名前</th>
          <th>メニュー</th>
          <th>希望日時</th>
          <th>ステータス</th>
        </tr>
      </thead>
      <tbody>
        ${SITE_DATA.reservations.map(r => `
          <tr>
            <td>${r.name}</td>
            <td>${r.menu}</td>
            <td>${r.date}</td>
            <td><span class="badge ${statusClass[r.status]}">${statusLabels[r.status]}</span></td>
          </tr>
        `).join('')}
      </tbody>
    `;
  </script>

</body>
</html>
